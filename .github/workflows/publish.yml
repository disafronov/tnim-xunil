name: Publish APT repository

on:
  pull_request:
    paths:
      - packages/**
      - scripts/**
      - .github/workflows/publish.yml
  push:
    branches: [main]
    paths:
      - packages/**
      - scripts/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts equivs dpkg-dev patch python3-yaml apt-utils
      - name: Build all configured packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs"
          count=0
          while IFS= read -r manifest; do
            /usr/bin/python3 scripts/build_package.py \
              "$(dirname "$manifest")" "$RUNNER_TEMP/debs"
            count=$((count + 1))
          done < <(find packages -mindepth 2 -maxdepth 2 -name package.yaml -print | sort)
          test "$count" -gt 0
      - name: Generate APT metadata
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/site"
          mkdir -p "$repo/pool"
          cp "$RUNNER_TEMP"/debs/*.deb "$repo/pool/"
          cd "$repo"
          dpkg-scanpackages pool /dev/null > Packages
          gzip -n -9 -c Packages > Packages.gz
          apt-ftparchive \
            -o 'APT::FTPArchive::Release::Origin=tnim-xunil' \
            -o "APT::FTPArchive::Release::Label=Dmitrii Safronov's Patched Packages" \
            -o 'APT::FTPArchive::Release::Suite=zena' \
            -o 'APT::FTPArchive::Release::Codename=zena' \
            -o 'APT::FTPArchive::Release::Version=22.3' \
            -o 'APT::FTPArchive::Release::Description=Personal fixes for upstream bugs and annoyances' \
            release . > Release
          grep -Fxq 'Origin: tnim-xunil' Release
          grep -Fxq 'Suite: zena' Release
          grep -Fxq 'Codename: zena' Release
          grep -Fxq 'Version: 22.3' Release
          grep -Fxq 'Description: Personal fixes for upstream bugs and annoyances' Release
          touch .nojekyll
          test -s Packages.gz
          test -s Release
          test "$(grep -c '^Package: ' Packages)" -gt 0
          while IFS= read -r deb; do
            name="$(dpkg-deb -f "$deb" Package)"
            grep -Fxq "Package: $name" Packages
          done < <(find pool -type f -name '*.deb' | sort)
      - name: Validate repository with APT
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/apt/lists/partial"
          printf 'deb [trusted=yes] file:%s ./\n' "$repo" > "$RUNNER_TEMP/apt/sources.list"
          sudo apt-get update \
            -o Dir::Etc::sourcelist="$RUNNER_TEMP/apt/sources.list" \
            -o Dir::Etc::sourceparts=- \
            -o Dir::State::lists="$RUNNER_TEMP/apt/lists" \
            -o APT::Get::List-Cleanup=0
      - uses: actions/upload-artifact@v7
        with:
          name: apt-repository
          path: ${{ runner.temp }}/site/
          include-hidden-files: true
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
