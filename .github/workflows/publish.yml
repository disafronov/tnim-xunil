name: Publish APT repository

on:
  push:
    branches: [main]
    paths:
      - packages/**
      - scripts/**
      - tnim-xunil.asc
      - index.html
      - .github/workflows/publish.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  publish:
    container:
      image: linuxmintd/mint22.3-amd64:latest
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Detect runner distribution
        id: distro
        shell: bash
        run: |
          . /etc/os-release
          echo "cache-prefix=apt-${{ runner.os }}-${{ runner.arch }}-${ID}-${VERSION_ID}-" >> "$GITHUB_OUTPUT"
      - name: Configure APT package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          printf 'Dir::Cache::archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' \
            "$RUNNER_TEMP/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-ci-package-cache > /dev/null
      - name: Restore APT downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.distro.outputs.cache-prefix }}${{ github.sha }}
          restore-keys: |
            ${{ steps.distro.outputs.cache-prefix }}
      - name: Install packaging tools
        run: |
          echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          sudo apt-get update
          sudo apt-get -y dist-upgrade
          sudo apt-get install -y --no-install-recommends \
            equivs patch python3-yaml apt-utils gnupg
      - name: Restore published packages
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          # A missing index means an empty archive; corrupt downloads are fatal.
          python3 scripts/restore_apt.py \
            https://disafronov.github.io/tnim-xunil/ "$RUNNER_TEMP/site" \
            --missing-sources "$RUNNER_TEMP/missing-sources" \
            > "$RUNNER_TEMP/published-sha"
          sha="$(cat "$RUNNER_TEMP/published-sha")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Determine packages to rebuild
        id: changed
        shell: bash
        env:
          PUBLISHED_SHA: ${{ steps.restore.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$PUBLISHED_SHA" ]]; then
            # One-time migration: existing archive predates the state marker.
            if [[ -d packages ]]; then
              find packages -mindepth 2 -maxdepth 2 -name package.yaml -printf '%h\n' | sort > "$RUNNER_TEMP/rebuild"
            else
              : > "$RUNNER_TEMP/rebuild"
            fi
          else
            git cat-file -e "$PUBLISHED_SHA^{commit}"
            git merge-base --is-ancestor "$PUBLISHED_SHA" HEAD
            git diff --name-only "$PUBLISHED_SHA" HEAD > "$RUNNER_TEMP/changed-files"
            # Only build inputs trigger package recompilation.
            python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"], "changed-files")
          changed = path.read_text().splitlines()
          path.write_text("\n".join(p for p in changed if p.startswith("packages/") or p == "scripts/build_package.py" or p == ".github/workflows/publish.yml" or p == ".github/workflows/build.yml") + "\n")
          PY
            python3 scripts/detect_changes.py \
              --changed-files "$RUNNER_TEMP/changed-files" > "$RUNNER_TEMP/matrix.json"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          matrix = json.loads(Path(os.environ["RUNNER_TEMP"], "matrix.json").read_text())
          Path(os.environ["RUNNER_TEMP"], "rebuild").write_text(
              "".join(f"packages/{name}\n" for name in matrix["package"])
          )
          PY
          fi
          # Drop binaries belonging to sources no longer present in manifests.
          mkdir -p "$RUNNER_TEMP/site/pool"
          python3 -m scripts.reconcile_apt "$RUNNER_TEMP/site/pool" > "$RUNNER_TEMP/removed-binaries"
          echo "Removed binaries from unmaintained sources:"
          cat "$RUNNER_TEMP/removed-binaries"
          # Rebuild any maintained source whose published binary has disappeared.
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          root = Path("packages")
          temp = Path(os.environ["RUNNER_TEMP"])
          rebuild = set((temp / "rebuild").read_text().splitlines())
          sources = {}
          for manifest in root.glob("*/package.yaml"):
              source = yaml.safe_load(manifest.read_text())["source"]["package"]
              sources[source] = str(manifest.parent)
          for source in (temp / "missing-sources").read_text().splitlines():
              if source in sources:
                  rebuild.add(sources[source])
              else:
                  with (temp / "removed-binaries").open("a") as output:
                      print(f"missing binary from retired source: {source}", file=output)
          (temp / "rebuild").write_text("".join(f"{name}\n" for name in sorted(rebuild)))
          PY
          echo "Packages selected for rebuild:"
          cat "$RUNNER_TEMP/rebuild"
          publish=false
          if [[ -s "$RUNNER_TEMP/rebuild" || -s "$RUNNER_TEMP/removed-binaries" || -z "$PUBLISHED_SHA" ]]; then
            publish=true
          elif ! git diff --quiet "$PUBLISHED_SHA" HEAD -- index.html tnim-xunil.asc .github/workflows/publish.yml scripts/prune_apt.py; then
            publish=true
          fi
          if [[ "$publish" == false ]]; then
            # Verify the files not covered by the signed package index.
            /usr/bin/python3 -m scripts.check_published_files \
              https://disafronov.github.io/tnim-xunil/ \
              --public-key tnim-xunil.asc --index-html index.html || publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publish repository: $publish"
      - name: Build changed packages
        if: steps.changed.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs" "$RUNNER_TEMP/site/pool"
          while IFS= read -r package_dir; do
            [[ -n "$package_dir" ]] || continue
            /usr/bin/python3 scripts/build_package.py "$package_dir" "$RUNNER_TEMP/debs"
          done < "$RUNNER_TEMP/rebuild"
          shopt -s nullglob
          for deb in "$RUNNER_TEMP"/debs/*.deb; do
            target="$RUNNER_TEMP/site/pool/$(basename "$deb")"
            if [[ -e "$target" ]] && ! cmp -s "$deb" "$target"; then
              echo "Refusing to replace an existing package: $target" >&2
              exit 1
            fi
            cp "$deb" "$target"
          done
      - name: Retain two versions and generate APT metadata
        if: steps.changed.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/site"
          python3 scripts/prune_apt.py "$repo/pool" --keep 2
          cd "$repo"
          dpkg-scanpackages --multiversion pool /dev/null > Packages
          gzip -n -9 -c Packages > Packages.gz
          apt-ftparchive \
            -o 'APT::FTPArchive::Release::Origin=tnim-xunil' \
            -o "APT::FTPArchive::Release::Label=Dmitrii Safronov's Patched Packages" \
            -o 'APT::FTPArchive::Release::Suite=zena' \
            -o 'APT::FTPArchive::Release::Codename=zena' \
            -o 'APT::FTPArchive::Release::Version=22.3' \
            -o 'APT::FTPArchive::Release::Description=Personal fixes for upstream bugs and annoyances' \
            release . > Release
          grep -Fxq 'Origin: tnim-xunil' Release
          grep -Fxq 'Suite: zena' Release
          grep -Fxq 'Codename: zena' Release
          grep -Fxq 'Version: 22.3' Release
          grep -Fxq 'Description: Personal fixes for upstream bugs and annoyances' Release
          cp "$GITHUB_WORKSPACE/index.html" index.html
          cp "$GITHUB_WORKSPACE/tnim-xunil.asc" tnim-xunil.asc
          touch .nojekyll
          printf '%s\n' "$GITHUB_SHA" > published-commit
          test -s Packages.gz
          test -s Release
          while IFS= read -r deb; do
            name="$(dpkg-deb -f "$deb" Package)"
            grep -Fxq "Package: $name" Packages
          done < <(find pool -type f -name '*.deb' | sort)
      - name: Sign APT release metadata
        if: steps.changed.outputs.publish == 'true'
        shell: bash
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          : "${APT_SIGNING_KEY:?Missing APT_SIGNING_KEY secret}"
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          repo="$RUNNER_TEMP/site"
          fingerprint="$(gpg --batch --show-keys --with-colons "$repo/tnim-xunil.asc" | awk -F: '$1 == "fpr" {print $10; exit}')"
          [[ -n "$fingerprint" ]]
          actual="$(gpg --batch --with-colons --list-secret-keys "$fingerprint" | awk -F: '$1 == "fpr" {print $10; exit}')"
          [[ "$actual" == "$fingerprint" ]]
          gpg --batch --yes --pinentry-mode loopback \
            --local-user "$fingerprint" \
            --clearsign --output "$repo/InRelease" "$repo/Release"
          gpg --batch --yes --pinentry-mode loopback \
            --local-user "$fingerprint" \
            --detach-sign --output "$repo/Release.gpg" "$repo/Release"
          gpg --batch --yes --dearmor --output "$RUNNER_TEMP/archive-key.gpg" "$repo/tnim-xunil.asc"
          gpgv --keyring "$RUNNER_TEMP/archive-key.gpg" "$repo/InRelease"
          gpgv --keyring "$RUNNER_TEMP/archive-key.gpg" "$repo/Release.gpg" "$repo/Release"
      - name: Validate repository with APT
        if: steps.changed.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/apt/lists/partial"
          printf 'deb [signed-by=%s/tnim-xunil.asc] file:%s ./\n' "$repo" "$repo" > "$RUNNER_TEMP/apt/sources.list"
          sudo apt-get update \
            -o Dir::Etc::sourcelist="$RUNNER_TEMP/apt/sources.list" \
            -o Dir::Etc::sourceparts=- \
            -o Dir::State::lists="$RUNNER_TEMP/apt/lists" \
            -o APT::Get::List-Cleanup=0
      - uses: actions/upload-artifact@v7
        if: steps.changed.outputs.publish == 'true'
        with:
          name: apt-repository
          path: ${{ runner.temp }}/site/
          include-hidden-files: true
      - name: Configure Pages
        if: steps.changed.outputs.publish == 'true'
        uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        if: steps.changed.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy GitHub Pages
        if: steps.changed.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
