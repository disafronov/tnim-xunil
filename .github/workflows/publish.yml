name: Publish APT repository

on:
  push:
    branches: [main]
    paths:
      - packages/**
      - scripts/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts equivs dpkg-dev patch python3-yaml apt-utils
      - name: Build all configured packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs"
          count=0
          while IFS= read -r manifest; do
            /usr/bin/python3 scripts/build_package.py \
              "$(dirname "$manifest")" "$RUNNER_TEMP/debs"
            count=$((count + 1))
          done < <(find packages -mindepth 2 -maxdepth 2 -name package.yaml -print | sort)
          test "$count" -gt 0
      - name: Generate APT metadata
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/site"
          mkdir -p "$repo/pool"
          cp "$RUNNER_TEMP"/debs/*.deb "$repo/pool/"
          cd "$repo"
          dpkg-scanpackages --multiversion pool /dev/null > Packages
          gzip -n -9 -c Packages > Packages.gz
          apt-ftparchive release . > Release
          touch .nojekyll
          test -s Packages.gz
          test -s Release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
