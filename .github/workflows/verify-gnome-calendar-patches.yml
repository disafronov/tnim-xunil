name: Verify gnome-calendar patches

on:
  pull_request:
    paths:
      - packages/gnome-calendar/**
      - .github/workflows/verify-gnome-calendar-patches.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts
      - name: Download source and apply patches
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/packages/gnome-calendar"
          mkdir -p /tmp/mint-source
          cd /tmp/mint-source
          dget -u -x 'https://fastly.linuxmint.io/pool/upstream/g/gnome-calendar/gnome-calendar_46.1-1mint2+zara.dsc'
          cd gnome-calendar-46.1
          while IFS= read -r name; do
            [[ -n "$name" && "$name" != \#* ]] || continue
            echo "Applying $name"
            patch --batch --forward -p1 < "$package_dir/patches/$name"
          done < "$package_dir/patches/series"
