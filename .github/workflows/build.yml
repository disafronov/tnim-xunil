name: Build gnome-calendar DEB

on:
  pull_request:
    paths:
      - packages/gnome-calendar/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts equivs dpkg-dev patch
      - name: Fetch and patch Linux Mint source
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/packages/gnome-calendar"
          mkdir -p "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          dget -u -x 'https://fastly.linuxmint.io/pool/upstream/g/gnome-calendar/gnome-calendar_46.1-1mint2+zara.dsc'
          cd gnome-calendar-46.1
          while IFS= read -r name; do
            [[ -n "$name" && "$name" != \#* ]] || continue
            patch --batch --forward --fuzz=0 -p1 < "$package_dir/patches/$name"
          done < "$package_dir/patches/series"
          # This derivative is maintained independently of Ubuntu's package.
          python3 - <<'PY'
          from pathlib import Path

          control = Path("debian/control")
          original = "Maintainer: Ubuntu Developers <ubuntu-devel-discuss@lists.ubuntu.com>"
          replacement = "Maintainer: Dmitrii Safronov <dhameoelin@gmail.com>"
          text = control.read_text()
          if text.count(original) != 1:
              raise SystemExit("Unexpected upstream Maintainer field")
          control.write_text(text.replace(original, replacement, 1))
          PY
          export DEBFULLNAME='Dmitrii Safronov'
          export DEBEMAIL='dhameoelin@gmail.com'
          dch --local '+my' --distribution zara --force-distribution \
            'Apply locally maintained gnome-calendar fixes.'
          echo "SOURCE_DIR=$PWD" >> "$GITHUB_ENV"
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          sudo mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control
      - name: Build Debian binary packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          dpkg-buildpackage --build=binary --no-sign
          mkdir -p "$RUNNER_TEMP/debs"
          find .. -maxdepth 1 -type f -name '*.deb' -exec cp -v {} "$RUNNER_TEMP/debs/" \;
          test -n "$(find "$RUNNER_TEMP/debs" -maxdepth 1 -name '*.deb' -print -quit)"
          for deb in "$RUNNER_TEMP"/debs/*.deb; do
            maintainer="$(dpkg-deb --field "$deb" Maintainer)"
            echo "$deb: Maintainer=$maintainer"
            test "$maintainer" = 'Dmitrii Safronov <dhameoelin@gmail.com>'
          done
      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnome-calendar-debs
          path: ${{ runner.temp }}/debs/*.deb
          if-no-files-found: error
