name: Build Debian packages

on:
  pull_request:
    paths:
      - packages/**
      - scripts/**
      - tests/**
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  detect:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Detect changed packages
        id: packages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
          matrix="$(python3 scripts/detect_changes.py --changed-files "$RUNNER_TEMP/changed-files")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected packages: $matrix"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '{"package":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts equivs dpkg-dev patch python3-yaml
      - name: Build package from manifest
        run: |
          /usr/bin/python3 scripts/build_package.py \
            "packages/${{ matrix.package }}" "$RUNNER_TEMP/debs"
      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-debs
          path: ${{ runner.temp }}/debs/*.deb
          if-no-files-found: error
