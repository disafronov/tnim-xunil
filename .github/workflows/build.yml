name: Build Debian packages

on:
  pull_request:
    paths:
      - packages/**
      - scripts/**
      - tests/**
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Detect changed packages
        id: packages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" HEAD)"
          git diff --name-only "$merge_base" HEAD > "$RUNNER_TEMP/changed-files"
          python3 scripts/detect_changes.py --changed-files "$RUNNER_TEMP/changed-files" > "$RUNNER_TEMP/matrix.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          packages = json.loads((temp / "matrix.json").read_text())["package"]
          (temp / "packages-to-build").write_text(
              "".join(f"{name}\n" for name in packages)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"has_packages={'true' if packages else 'false'}", file=output)
          print(f"Selected packages: {packages}")
          PY
      - name: Detect runner distribution
        id: distro
        if: steps.packages.outputs.has_packages == 'true'
        shell: bash
        run: |
          . /etc/os-release
          echo "cache-prefix=apt-${{ runner.os }}-${{ runner.arch }}-${ID}-${VERSION_ID}-" >> "$GITHUB_OUTPUT"
      - name: Configure APT package archive
        if: steps.packages.outputs.has_packages == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          printf 'Dir::Cache::archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' \
            "$RUNNER_TEMP/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-ci-package-cache > /dev/null
      # Re-run unchanged package builds to measure APT cache reuse.
      - name: Restore APT downloads
        if: steps.packages.outputs.has_packages == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.distro.outputs.cache-prefix }}${{ github.sha }}
          restore-keys: |
            ${{ steps.distro.outputs.cache-prefix }}
      - name: Install Debian packaging tools
        if: steps.packages.outputs.has_packages == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts equivs dpkg-dev patch python3-yaml
      - name: Build changed packages
        if: steps.packages.outputs.has_packages == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs"
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            /usr/bin/python3 scripts/build_package.py \
              "packages/$package" "$RUNNER_TEMP/debs"
          done < "$RUNNER_TEMP/packages-to-build"
      - name: Upload DEB artifacts
        if: steps.packages.outputs.has_packages == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: ${{ runner.temp }}/debs/*.deb
          if-no-files-found: error
