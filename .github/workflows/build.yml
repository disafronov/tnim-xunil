name: Build gnome-calendar DEB

on:
  pull_request:
    paths:
      - packages/gnome-calendar/**
      - scripts/build_package.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts equivs dpkg-dev patch python3-yaml
      - name: Build package from manifest
        run: |
          /usr/bin/python3 scripts/build_package.py \
            packages/gnome-calendar "$RUNNER_TEMP/debs"
      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnome-calendar-debs
          path: ${{ runner.temp }}/debs/*.deb
          if-no-files-found: error
